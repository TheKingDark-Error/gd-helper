name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: iOS
            os: macos-latest
            target: iOS
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          cli: latest
          combine: true
          target: ${{ matrix.config.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }} Build
          path: build-*/

  combine:
    name: Combine
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: geode-sdk/build-geode-mod/combine@main
        with:
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: GDHelper-AllPlatforms
          path: '*.geode'
